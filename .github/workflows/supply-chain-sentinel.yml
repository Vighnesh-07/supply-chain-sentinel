name: Supply Chain Sentinel

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker image name to scan'
        default: 'nexus-studio-app:latest'
        type: string
      dockerfile_path:
        description: 'Path to Dockerfile'
        default: 'demo-apps/nexus-studio/Dockerfile'
        type: string
      docker_context:
        description: 'Docker build context directory'
        default: '.'
        type: string
      include_os:
        description: 'Include OS packages in scan'
        default: 'false'
        type: string
      fail_on_critical:
        description: 'Fail the CI if CRITICAL vulnerabilities are found'
        default: 'true'
        type: string
  workflow_call:
    inputs:
      image_name:
        description: 'Docker image name to scan'
        default: 'nexus-studio-app:latest'
        type: string
      dockerfile_path:
        description: 'Path to Dockerfile'
        default: 'demo-apps/nexus-studio/Dockerfile'
        type: string
      docker_context:
        description: 'Docker build context directory'
        default: '.'
        type: string
      include_os:
        description: 'Include OS packages in scan'
        default: 'false'
        type: string
      fail_on_critical:
        description: 'Fail the CI if CRITICAL vulnerabilities are found'
        default: 'true'
        type: string
    outputs:
      sarif_path:
        description: 'Path to generated SARIF file'
        value: ${{ jobs.dependency-audit.outputs.sarif_path }}
      error_count:
        description: 'Number of errors found'
        value: ${{ jobs.dependency-audit.outputs.error_count }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    outputs:
      sarif_path: ${{ steps.set-outputs.outputs.sarif_path }}
      error_count: ${{ steps.check-results.outputs.error_count }}
      warning_count: ${{ steps.check-results.outputs.warning_count }}
      package_count: ${{ steps.check-results.outputs.package_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Syft
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      - name: Install Python dependencies
        shell: bash
        run: |
          cd monitor && pip install --no-cache-dir -r requirements.txt

      - name: Build target Docker image
        id: docker-build
        shell: bash
        run: |
          DOCKERFILE="${{ inputs.dockerfile_path }}"
          IMAGE="${{ inputs.image_name }}"
          CONTEXT="${{ inputs.docker_context }}"

          # Auto-detect Dockerfile if empty or not found
          if [ -z "$DOCKERFILE" ] || [ ! -f "$DOCKERFILE" ]; then
            if [ -f "demo-apps/nexus-studio/Dockerfile" ]; then
              echo "Auto-detected repository demo Dockerfile: demo-apps/nexus-studio/Dockerfile"
              DOCKERFILE="demo-apps/nexus-studio/Dockerfile"
              IMAGE="${IMAGE:-nexus-studio-app:latest}"
              CONTEXT="${CONTEXT:-.}"
            elif [ -f "Dockerfile" ]; then
              DOCKERFILE="Dockerfile"
              IMAGE="${IMAGE:-target-app:latest}"
              CONTEXT="${CONTEXT:-.}"
            elif [ -f "app/Dockerfile" ]; then
              DOCKERFILE="app/Dockerfile"
              IMAGE="${IMAGE:-vulnapp:latest}"
              CONTEXT="${CONTEXT:-./app}"
            fi
          fi

          IMAGE="${IMAGE:-nexus-studio-app:latest}"
          CONTEXT="${CONTEXT:-.}"

          echo "TARGET_IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "target_image=$IMAGE" >> $GITHUB_OUTPUT

          if [ -n "$DOCKERFILE" ] && [ -f "$DOCKERFILE" ]; then
            echo "Building Docker image: $IMAGE from $DOCKERFILE (context: $CONTEXT)"
            docker build -t "$IMAGE" -f "$DOCKERFILE" "$CONTEXT"
          else
            echo "No Dockerfile found, will attempt to scan image directly: $IMAGE"
          fi

      - name: Run Supply Chain Sentinel
        id: audit
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p monitor/reports
          IMAGE="${TARGET_IMAGE:-${{ inputs.image_name || 'nexus-studio-app:latest' }}}"
          INCLUDE_OS_FLAG=""
          if [ "${{ inputs.include_os || 'false' }}" == "true" ]; then
            INCLUDE_OS_FLAG="--include-os"
          fi
          cd monitor && python monitor.py \
            --image "$IMAGE" \
            --report-dir ./reports \
            --sarif ./reports/results.sarif \
            $INCLUDE_OS_FLAG

      - name: Set output paths
        id: set-outputs
        if: always()
        shell: bash
        run: |
          echo "sarif_path=monitor/reports/results.sarif" >> $GITHUB_OUTPUT

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('monitor/reports/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: monitor/reports/results.sarif
          category: supply-chain-sentinel

      - name: Upload reports as artifacts
        if: always() && hashFiles('monitor/reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-reports
          path: monitor/reports/
          retention-days: 30

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('monitor/reports/results.sarif') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let errorCount = 0;
            let warningCount = 0;
            let packageCount = 0;
            try {
              const sarifRaw = fs.readFileSync('monitor/reports/results.sarif', 'utf8');
              const sarif = JSON.parse(sarifRaw);
              const results = (sarif.runs || [{}])[0].results || [];
              errorCount = results.filter(r => r.level === 'error').length;
              warningCount = results.filter(r => r.level === 'warning').length;
              const driver = ((sarif.runs || [{}])[0].tool || {}).driver || {};
              packageCount = (driver.rules || []).length;
            } catch (e) {
              console.log('Could not parse SARIF file:', e.message);
            }
            const statusIcon = errorCount > 0 ? '[FAIL]' : '[PASS]';
            const body = [
              `## Supply Chain Sentinel Results ${statusIcon}`,
              '',
              '| Metric | Count |',
              '|--------|-------|',
              `| Errors (Critical Findings) | ${errorCount} |`,
              `| Warnings | ${warningCount} |`,
              `| Packages Scanned | ${packageCount} |`,
              '',
              errorCount > 0
                ? '> **Critical vulnerabilities or zero-day implants detected.** Review the Security tab for details.'
                : '> No critical vulnerabilities found.',
              '',
              `Full reports are available as [workflow artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check results and fail on critical
        id: check-results
        if: always()
        shell: bash
        run: |
          FAIL_FLAG=""
          if [ "${{ inputs.fail_on_critical || 'true' }}" == "true" ]; then
            FAIL_FLAG="--fail-on-critical"
          fi
          python monitor/utils/ci_gate.py monitor/reports/results.sarif $FAIL_FLAG
