name: Supply Chain Sentinel (Reusable)

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Docker image name to scan'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        default: 'Dockerfile'
        type: string
      docker_context:
        description: 'Docker build context directory'
        required: false
        default: '.'
        type: string
      include_os:
        description: 'Include OS packages in scan'
        required: false
        default: 'false'
        type: string
      fail_on_critical:
        description: 'Fail the CI if CRITICAL vulnerabilities are found'
        required: false
        default: 'true'
        type: string
    secrets:
      GEMINI_API_KEY:
        required: false
    outputs:
      sarif_path:
        description: 'Path to generated SARIF file'
        value: ${{ jobs.dependency-audit.outputs.sarif_path }}
      error_count:
        description: 'Number of errors found'
        value: ${{ jobs.dependency-audit.outputs.error_count }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-audit:
    name: Dependency Audit (Reusable)
    runs-on: ubuntu-latest

    outputs:
      sarif_path: ${{ steps.set-outputs.outputs.sarif_path }}
      error_count: ${{ steps.check-results.outputs.error_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Syft
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      - name: Install Python dependencies
        shell: bash
        run: |
          cd monitor && pip install --no-cache-dir -r requirements.txt

      - name: Build target Docker image
        id: docker-build
        shell: bash
        run: |
          DOCKERFILE="${{ inputs.dockerfile_path }}"
          IMAGE="${{ inputs.image_name }}"
          CONTEXT="${{ inputs.docker_context }}"
          if [ -f "$DOCKERFILE" ]; then
            echo "Building Docker image: $IMAGE from $DOCKERFILE"
            docker build -t "$IMAGE" -f "$DOCKERFILE" "$CONTEXT"
          else
            echo "No Dockerfile found at $DOCKERFILE, skipping build"
            echo "build_skipped=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Supply Chain Sentinel
        id: audit
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p monitor/reports
          INCLUDE_OS_FLAG=""
          if [ "${{ inputs.include_os }}" == "true" ]; then
            INCLUDE_OS_FLAG="--include-os"
          fi
          cd monitor && python monitor.py \
            --image "${{ inputs.image_name }}" \
            --report-dir ./reports \
            --sarif ./reports/results.sarif \
            $INCLUDE_OS_FLAG

      - name: Set output paths
        id: set-outputs
        shell: bash
        run: |
          echo "sarif_path=monitor/reports/results.sarif" >> $GITHUB_OUTPUT

      - name: Check results and fail on critical
        id: check-results
        shell: bash
        run: |
          ERROR_COUNT=$(python -c "
          import json, sys
          try:
              with open('monitor/reports/results.sarif') as f:
                  sarif = json.load(f)
              results = sarif.get('runs', [{}])[0].get('results', [])
              errors = sum(1 for r in results if r.get('level') == 'error')
              print(errors)
          except Exception as e:
              print(0)
          ")
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          if [ "$ERROR_COUNT" -gt 0 ] && [ "${{ inputs.fail_on_critical }}" == "true" ]; then
            echo "FAIL: $ERROR_COUNT critical security findings detected!"
            exit 1
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: monitor/reports/results.sarif
          category: supply-chain-sentinel

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-reports
          path: monitor/reports/
          retention-days: 30
