# ═══════════════════════════════════════════════════════════════
# Supply Chain Sentinel — Docker Compose
# ═══════════════════════════════════════════════════════════════
# Orchestrates the vulnerable demo application and supporting
# services for supply chain security monitoring.
# ═══════════════════════════════════════════════════════════════

version: "3.9"

services:
  # ─── Vulnerable Demo Application ─────────────────────────
  vulnapp:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: vulnapp:latest
    container_name: vulnapp
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    restart: unless-stopped
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─── Nexus Studio Application ────────────────────────────
  nexus-studio:
    build:
      context: .
      dockerfile: demo-apps/nexus-studio/Dockerfile
    image: nexus-studio-app:latest
    container_name: nexus-studio-app
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─── eBPF Monitoring Sidecar ─────────────────────────────
  # Start with: docker compose --profile ebpf up sentinel-agent -d
  sentinel-agent:
    build:
      context: ./sentinel-agent
      dockerfile: Dockerfile
    image: sentinel-agent:latest
    container_name: sentinel-agent
    # eBPF requires privileged mode and access to host PID/network namespaces
    privileged: true
    pid: "host"
    network_mode: "host"
    volumes:
      # Kernel headers and modules (read-only)
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      # Log output directory
      - ./monitor/reports:/reports
    ports:
      - "7777:7777"
    environment:
      - SENTINEL_LOG_DIR=/reports
    command: ["--port", "7777"]
    restart: unless-stopped
    profiles:
      - ebpf   # Only started when: docker compose --profile ebpf up

# ─── Networks ──────────────────────────────────────────────
networks:
  sentinel-net:
    driver: bridge
    name: sentinel-network
    # Phase 3: Network monitoring will capture traffic on this bridge
